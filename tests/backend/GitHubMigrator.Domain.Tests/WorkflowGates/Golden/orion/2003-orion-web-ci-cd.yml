# azure-tasks: converted=NodeTool@0,Cache@2,Npm@1,PublishBuildArtifacts@1,CopyFilesOverSSH@0,SSH@0 manual=PublishTestResults@2
name: orion-web CI-CD
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  npm_config_cache: ${{ github.workspace }}/.npm
  NODE_ENV: production
  NODE_OPTIONS: --max-old-space-size=4096
  ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  AZURE_REGION: ${{ vars.AZURE_REGION }}
  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
jobs:
  build-and-test:
    name: Build and test on Node ${{ matrix.nodeVersion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        nodeVersion:
          - 18.x
          - 20.x
          - 22.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node ${{ matrix.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.nodeVersion }}
          registry-url: ${{ vars.ORION_NPM_REGISTRY_URL }}
      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: npm | ${{ runner.os }} | ${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm | ${{ runner.os }}
          path: ${{ env.npm_config_cache }}
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ORION_NPM_REGISTRY_TOKEN }}
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Unit tests
        env:
          NPM_TOKEN: ${{ secrets.npmToken }}
          CI: 'true'
        run: |
          set -euo pipefail
          npm test -- --ci --reporters=default --reporters=jest-junit
      # MANUAL PORT REQUIRED: PublishTestResults@2 — Azure shows a Tests tab. Here only junit.xml is kept as an artifact.
      - name: Publish test results (artifact only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-node-${{ matrix.nodeVersion }}
          path: junit.xml
          if-no-files-found: warn
      - name: Build bundle
        if: ${{ matrix.nodeVersion == '20.x' }}
        run: npm run build
      - name: Report bundle size
        if: ${{ matrix.nodeVersion == '20.x' }}
        shell: pwsh
        run: |
          $size = (Get-ChildItem build -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Bundle size: $size bytes"
      - name: Publish web bundle
        if: ${{ matrix.nodeVersion == '20.x' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: build

  deploy:
    name: Copy bundle to the staging hosts
    needs: build-and-test
    if: ${{ github.ref == 'refs/heads/main' }}
    # The source demands agents with docker and npm; custom runner labels are not accepted by the gates, so the runner
    # group behind [self-hosted, linux] must provide both.
    runs-on: [self-hosted, linux]
    environment: staging
    steps:
      - name: Download the web bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web-dist
      - name: Prepare SSH access (orion-ssh-web)
        env:
          SSH_KEY: ${{ secrets.ORION_SSH_WEB_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORION_SSH_WEB_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/orion_deploy"
          chmod 600 "$HOME/.ssh/orion_deploy"
      - name: Upload bundle
        env:
          SSH_HOST: ${{ vars.ORION_SSH_WEB_HOST }}
          SSH_USER: ${{ vars.ORION_SSH_WEB_USER }}
        run: rsync -az --delete -e "ssh -i $HOME/.ssh/orion_deploy -o StrictHostKeyChecking=yes" web-dist/ "$SSH_USER@$SSH_HOST:/var/www/orion/"
      - name: Reload web server
        env:
          SSH_HOST: ${{ vars.ORION_SSH_WEB_HOST }}
          SSH_USER: ${{ vars.ORION_SSH_WEB_USER }}
        run: ssh -i "$HOME/.ssh/orion_deploy" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'sudo systemctl reload nginx'
      - name: Remove the deployment key
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/orion_deploy"
      - name: Use Node for publishing
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          registry-url: ${{ vars.ORION_NPM_FEED_URL }}
      # The source's deployment job checks out no sources, so its npm publish runs in an empty directory. This step
      # publishes the downloaded bundle directory instead and needs a human to confirm that is the intended package.
      - name: Publish UI kit
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: web-dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ORION_NPM_FEED_TOKEN }}
        run: npm publish
