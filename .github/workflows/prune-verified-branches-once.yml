name: One-time cleanup of verified integrated branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-verified-branches-once.yml
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'KeyserDSoze/GitHubMigrator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check exact merged branch tips and delete obsolete refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          REPO = 'KeyserDSoze/GitHubMigrator'
          MERGED_SHA = '6db326691b5dcab53390078745114187efdbd09b'
          F090_SHA = 'db3dbfb91eb25b51625b0bcbd84289f2284fd816'
          EXPECTED = json.loads(r'''{"ci/f029-latest-head-validation":"db53faf2099fa24011ca601de14eeda2945a342a","feature/f005-github-destination-access":"2e5e03373259a52872752e233df308ef08d2c1b6","feature/f005-github-target-preflight":"2038e3f4c500de5fe2e7871d2d3a58abb6d5cf45","feature/f005-readonly-plan-preview":"4b5530c55b48918aa5b2ea88e7cb418bc1ac51f7","feature/f005-versioned-plan-drafts":"4eb981414370b54ec3516a8b341d2c2b334ac609","feature/f008-azdo-security-repo-checkpoints":"6b4455c14f02a30a21a9fff9f581b499e00a83c5","feature/f008-durable-azdo-discovery":"fff2246d8ec0dd8e09418d954cfe40cee93f5932","feature/f008-durable-azdo-page-checkpoints":"487e956a6422780139e4371fe0d55cc5bd58c73e","feature/f008-durable-staging-jobs":"b882f9686b056996665f8b6156a90266f9465ca1","feature/f013-staging-incremental-sync":"1dcd4585e0f675a68ae01ec8948829649343308f","feature/f014-canonical-staging-from-ref-chunks":"4b7ed0bf7f0b637da455c4695e05998b3be88118","feature/f014-immutable-ref-manifests":"32af55e3f3fbc9dbb7a03157dac6c21787e38312","feature/f014-source-ref-externalization":"f4e237bcadec86732826ad8af8ea314cee90b5c4","feature/f014-streamed-git-ref-observations":"fb4df893c66431eab4ef615e6bdf3f910093ed39","feature/f015-graph-identity-page-observations":"53f17c929a431149d68de3e06ebaf579938a2005","feature/f016-paged-f004-identity-review":"4e0e82e81849140e84c119c01f8341a0c6a5e9d3","feature/f017-snapshot-bound-plan-evidence":"589c5879b452fd7f00c16cf9b2d8504a3c9927f1","feature/f018-externalized-graph-identity-scan":"ad5accf37ab7e68dff9fe0a3c27754b8191bca63","feature/f019-graph-security-groups":"311d858e3ef8d4380e42458f310887c8f4a41497","feature/f020-membership-evidence-reconciliation":"8e8c54c8441a1459e0a8de37ea2d7b5c0bae6331","feature/f021-externalized-graph-memberships":"410f06f77025a322495c22743b033643694f1e83","feature/f022-durable-acl-evidence":"c6b6e7b77060b1c00aaa929cc2f098f66aeb8ae9","feature/f022-durable-raw-acl-observations":"410f06f77025a322495c22743b033643694f1e83","feature/f02