name: Quality gates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: .NET 10 / xUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and test domain + business logic
        run: dotnet test src/backend/GitHubMigrator.slnx --verbosity normal --collect:"XPlat Code Coverage"
      - name: Upload backend coverage and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: tests/backend/**/TestResults/**
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: React / Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies and build
        working-directory: src/frontend
        run: |
          npm install
          npm run build
      - name: Install Playwright tests and browser
        working-directory: tests/frontend
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run UI contract tests
        working-directory: tests/frontend
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Upload Playwright traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            tests/frontend/playwright-report/**
            tests/frontend/test-results/**
          if-no-files-found: warn
          retention-days: 7

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize without remote backend
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Validate Linux development entrypoint
        run: bash -n script/dev.sh
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.test -f docker/docker-compose.yml config --quiet
      - name: Validate Azure resource definitions
        working-directory: infra/terraform
        run: terraform validate

  postgres-integration:
    name: PostgreSQL 17 / Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: migrator_test
          POSTGRES_PASSWORD: ci-local-only-password
          POSTGRES_DB: migrator_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrator_test -d migrator_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify persistence with actual PostgreSQL and optimistic concurrency
        env:
          GITHUBMIGRATOR_TEST_POSTGRES: Host=localhost;Port=5432;Database=migrator_tests;Username=migrator_test;Password=ci-local-only-password;Pooling=false
        run: dotnet test tests/integration/GitHubMigrator.Integration.Tests.csproj --verbosity normal --collect:"XPlat Code Coverage"
      - name: Upload PostgreSQL integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-results
          path: tests/integration/TestResults/**
          if-no-files-found: warn
          retention-days: 7
