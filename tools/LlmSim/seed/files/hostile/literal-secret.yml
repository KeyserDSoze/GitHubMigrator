    branches: [main]
permissions:
  contents: read
env:
  AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
  RELEASE_TOKEN: ghp_0123456789abcdefghijklmnopqrstuvwxyz
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
